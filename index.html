<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RomaTareas</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>📅</text></svg>">
<style>
  :root {
    --bg: #FFFAF5;
    --card: #FFFDFA;
    --text: #261D29;
    --text-soft: #4D414D;
    --text-muted: #8A7B86;
    --border: #E9DCD2;
    --primary: #681831;
    --primary-suave: rgba(104,24,49,.08);
    --alerta: #A83C37;
    --hecho: #1F8654;
    --sombra: 0 1px 2px rgba(76,34,50,.04), 0 10px 30px rgba(76,34,50,.06);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px 60px; }
  [hidden] { display: none !important; }
  button { font: inherit; cursor: pointer; }

  /* ── cabecera ── */
  .top { display: flex; align-items: center; justify-content: space-between; padding: 18px 0 12px; }
  .marca { font-family: Georgia, serif; font-size: 19px; letter-spacing: -.01em; }
  .salir { background: none; border: 0; color: var(--text-muted); font-size: 12px; padding: 6px; }

  /* ── pestañas ── */
  .tabs { display: flex; gap: 4px; background: var(--primary-suave); padding: 4px; border-radius: 12px; }
  .tabs button {
    flex: 1; border: 0; background: none; padding: 9px 4px; border-radius: 9px;
    font-size: 13.5px; font-weight: 600; color: var(--text-muted); transition: all .15s;
  }
  .tabs button[aria-selected="true"] { background: var(--card); color: var(--primary); box-shadow: var(--sombra); }

  /* ── tira de la semana ── */
  .tira { display: flex; gap: 5px; margin: 16px 0 20px; }
  .tira button {
    flex: 1; border: 1px solid var(--border); background: var(--card);
    border-radius: 12px; padding: 9px 2px 8px; display: flex; flex-direction: column;
    align-items: center; gap: 5px; transition: all .15s; color: inherit;
  }
  .tira .letra { font-size: 11px; font-weight: 700; color: var(--text-muted); letter-spacing: .04em; }
  .tira .num { font-size: 15px; font-weight: 700; line-height: 1; }
  .tira .punto { width: 6px; height: 6px; border-radius: 50%; background: transparent; }
  .tira .punto.pendiente { background: var(--primary); }
  .tira .punto.hecho { background: var(--hecho); }
  .tira .punto.tarde { background: var(--alerta); }
  .tira button[aria-current="true"] { border-color: var(--primary); background: var(--primary); color: #fff; }
  .tira button[aria-current="true"] .letra { color: rgba(255,255,255,.72); }
  .tira button[aria-current="true"] .punto.pendiente { background: #fff; }
  .tira button.es-hoy:not([aria-current="true"]) { border-color: var(--primary); }

  /* ── el día ── */
  .fecha { font-size: 11.5px; font-weight: 700; letter-spacing: .14em;
    text-transform: uppercase; color: var(--text-muted); margin: 0 0 8px; }
  .titular { font-family: Georgia, serif; font-size: 25px; line-height: 1.22;
    letter-spacing: -.015em; margin: 0 0 10px; font-weight: 500; }
  .porque { font-size: 14.5px; color: var(--text-soft); margin: 0 0 22px; }

  .paso { background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 14px; margin-bottom: 10px; box-shadow: var(--sombra); }
  .paso-fila { display: flex; gap: 12px; align-items: flex-start; }
  .marca { flex: 0 0 auto; width: 28px; height: 28px; border-radius: 50%;
    border: 2px solid var(--primary); background: none; color: transparent;
    display: flex; align-items: center; justify-content: center; font-size: 15px; padding: 0; }
  .marca:hover, .marca:focus-visible { background: var(--primary); color: #fff; }
  .paso.listo { opacity: .55; }
  .paso.listo .marca { background: var(--hecho); border-color: var(--hecho); color: #fff; }
  .paso.listo .paso-titulo { text-decoration: line-through; }
  .paso-titulo { font-weight: 600; font-size: 15px; flex: 1; min-width: 0; word-wrap: break-word; }
  .nota { margin: 6px 0 0 40px; font-size: 12.5px; color: var(--text-muted); }

  .ver { background: none; border: 0; color: var(--primary); font-size: 13px;
    font-weight: 600; padding: 10px 0 0 40px; display: block; }
  .guion { display: none; padding-left: 40px; margin-top: 8px; }
  .guion.abierto { display: block; }
  .guion pre { margin: 0; padding: 12px; background: var(--bg); border: 1px solid var(--border);
    border-radius: 10px; font-family: ui-monospace, Consolas, monospace;
    font-size: 12px; line-height: 1.6; white-space: pre-wrap; word-wrap: break-word;
    max-height: 52vh; overflow-y: auto; }
  .copiar { margin-top: 8px; font-size: 13px; font-weight: 600; padding: 8px 14px;
    border: 1px solid var(--primary); border-radius: 9px; background: var(--card); color: var(--primary); }
  .copiar.ok { border-color: var(--hecho); color: var(--hecho); }

  .necesito { background: var(--primary); color: #fff; border-radius: 14px; padding: 14px 16px; margin-top: 20px; }
  .necesito b { display: block; font-size: 10.5px; letter-spacing: .13em;
    text-transform: uppercase; opacity: .68; margin-bottom: 3px; }
  .necesito span { font-size: 14.5px; line-height: 1.5; }

  .detalle-brief { margin-top: 16px; }
  .detalle-brief summary { list-style: none; cursor: pointer; font-size: 13px;
    font-weight: 600; color: var(--primary); padding: 8px 0; }
  .detalle-brief summary::-webkit-details-marker { display: none; }
  .detalle-brief summary::before { content: '▸ '; }
  .detalle-brief[open] summary::before { content: '▾ '; }
  .detalle-brief pre { margin: 0; padding: 13px; background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; font-family: ui-monospace, Consolas, monospace;
    font-size: 12px; line-height: 1.62; white-space: pre-wrap; word-wrap: break-word; }

  .nada { color: var(--text-muted); font-size: 14.5px; padding: 34px 6px;
    text-align: center; line-height: 1.6; white-space: pre-line; }

  /* ── rutina y más ── */
  .seccion-tit { font-size: 11.5px; font-weight: 700; letter-spacing: .13em;
    text-transform: uppercase; color: var(--text-muted); margin: 22px 0 10px; }
  .campo { width: 100%; font-size: 15px; padding: 11px 12px; border: 1px solid var(--border);
    border-radius: 10px; background: var(--card); color: var(--text); margin-bottom: 8px; font-family: inherit; }
  textarea.campo { min-height: 90px; resize: vertical; font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
  .btn { width: 100%; border: 0; border-radius: 11px; background: var(--primary);
    color: #fff; font-size: 15px; font-weight: 600; padding: 12px; }
  .btn.claro { background: var(--card); color: var(--primary); border: 1px solid var(--primary); }
  .btn:disabled { opacity: .5; }
  .aviso { font-size: 13px; margin: 8px 0 0; min-height: 18px; }
  .aviso.ok { color: var(--hecho); } .aviso.mal { color: var(--alerta); }
  .fila2 { display: flex; gap: 8px; margin-bottom: 8px; }

  /* ── PIN ── */
  .pin { max-width: 320px; margin: 20vh auto 0; padding: 0 20px; text-align: center; }
  .pin h1 { font-family: Georgia, serif; font-size: 30px; margin: 0 0 8px; font-weight: 500; }
  .pin p { color: var(--text-muted); font-size: 14px; margin: 0 0 22px; }
  .pin input { text-align: center; font-size: 21px; letter-spacing: .3em; }
</style>
</head>
<body>

<div id="p-pin" class="pin">
  <h1>RomaTareas</h1>
  <p>Escribe tu PIN. Queda guardado en este dispositivo.</p>
  <input id="pin" class="campo" type="password" inputmode="numeric" placeholder="••••" aria-label="PIN">
  <button class="btn" id="entrar">Entrar</button>
  <p class="aviso mal" id="pin-error" role="alert"></p>
</div>

<div id="p-app" class="wrap" hidden>
  <div class="top">
    <span class="marca">RomaTareas</span>
    <button class="salir" id="salir">Salir</button>
  </div>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="dia" aria-selected="true">Día</button>
    <button role="tab" data-tab="rutina" aria-selected="false">Rutina</button>
    <button role="tab" data-tab="mas" aria-selected="false">Más</button>
  </nav>

  <div id="tira" class="tira"></div>
  <div id="vista"></div>
</div>

<script src="utils/config.js"></script>
<script>
(function () {
  'use strict';

  var API = window.SUPABASE_URL + '/rest/v1/tareas';
  var KEY = window.SUPABASE_ANON_KEY;
  var pinHash = localStorage.getItem('romatareas-pin');

  var estado = { tab: 'dia', dia: inicioDia(new Date()), tareas: [], brief: null };

  var LETRAS = ['D', 'L', 'M', 'X', 'J', 'V', 'S'];
  var NOMBRES = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
  var MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  var REPITE = { diaria: 'cada día', mensual: 'cada mes', 'semanal:0': 'domingos',
    'semanal:1': 'lunes', 'semanal:2': 'martes', 'semanal:3': 'miércoles',
    'semanal:4': 'jueves', 'semanal:5': 'viernes', 'semanal:6': 'sábados' };

  // ── utilidades ──────────────────────────────────────────────────────────
  function cabeceras(extra) {
    var h = { apikey: KEY, Authorization: 'Bearer ' + KEY, 'Content-Type': 'application/json' };
    for (var k in extra) h[k] = extra[k];
    return h;
  }
  async function hash(t) {
    var b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
    return Array.from(new Uint8Array(b)).map(function (x) { return x.toString(16).padStart(2, '0'); }).join('');
  }
  function inicioDia(d) { var x = new Date(d); x.setHours(0, 0, 0, 0); return x; }
  function clave(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function mismoDia(a, b) { return inicioDia(a).getTime() === inicioDia(b).getTime(); }

  // La tira NO es la semana del calendario: es una ventana que empieza ayer
  // y llega cinco dias adelante. Anclada a la semana natural, un sabado te
  // deja mirando la semana que termina y el plan de la siguiente queda
  // invisible — que es justo lo contrario de un planificador.
  function inicioVentana() {
    var x = inicioDia(new Date());
    x.setDate(x.getDate() - 1);
    return x;
  }

  // Para consultas: el domingo de hace una semana, como suelo de datos.
  function sueloDatos() {
    var x = inicioDia(new Date());
    x.setDate(x.getDate() - 9);
    return x;
  }

  function proximaFecha(desde, rec) {
    var d = new Date(desde);
    if (rec === 'diaria') { d.setDate(d.getDate() + 1); return d; }
    if (rec === 'mensual') { d.setMonth(d.getMonth() + 1); return d; }
    var m = /^semanal:([0-6])$/.exec(rec || '');
    if (m) {
      d.setDate(d.getDate() + 1);
      while (d.getDay() !== Number(m[1])) d.setDate(d.getDate() + 1);
      return d;
    }
    return null;
  }

  // ── datos ───────────────────────────────────────────────────────────────
  // Se traen pendientes y completadas juntas: mirar un día pasado tiene que
  // mostrar lo que se hizo, no solo lo que quedó colgando.
  async function traer() {
    var desde = sueloDatos();
    var url = API + '?select=*&pin_hash=eq.' + pinHash +
      '&or=(completada_en.is.null,completada_en.gte.' + desde.toISOString() + ')' +
      '&order=vence_en.asc.nullslast';
    var r = await fetch(url, { headers: cabeceras() });
    if (!r.ok) throw new Error('No se pudo cargar (' + r.status + ')');
    return r.json();
  }
  async function crear(filas) {
    var r = await fetch(API, { method: 'POST', headers: cabeceras({ Prefer: 'return=minimal' }), body: JSON.stringify(filas) });
    if (!r.ok) throw new Error('No se pudo guardar: ' + (await r.text()));
  }
  async function marcar(t, hecha) {
    var r = await fetch(API + '?id=eq.' + t.id, {
      method: 'PATCH', headers: cabeceras({ Prefer: 'return=minimal' }),
      body: JSON.stringify({ completada_en: hecha ? new Date().toISOString() : null })
    });
    if (!r.ok) throw new Error('No se pudo guardar');
    if (hecha && t.recurrencia) {
      var p = proximaFecha(t.vence_en || new Date(), t.recurrencia);
      if (p) await crear([{ pin_hash: pinHash, titulo: t.titulo, detalle: t.detalle,
                            vence_en: p.toISOString(), recurrencia: t.recurrencia }]);
    }
  }

  // ── el reparto: rutina es lo que se repite, el día es lo demás ──────────
  function deRutina(t) { return !!t.recurrencia; }
  function delDia(t, d) { return !t.recurrencia && t.vence_en && mismoDia(new Date(t.vence_en), d); }

  // ── pintar ──────────────────────────────────────────────────────────────
  var vista = document.getElementById('vista');
  var tira = document.getElementById('tira');

  function el(tag, cls, txt) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (txt != null) n.textContent = txt;
    return n;
  }

  function pintarTira() {
    tira.innerHTML = '';
    tira.hidden = estado.tab !== 'dia';
    if (estado.tab !== 'dia') return;

    var ini = inicioVentana();
    var hoy = inicioDia(new Date());

    for (var i = 0; i < 7; i++) {
      var d = new Date(ini); d.setDate(d.getDate() + i);
      var suyas = estado.tareas.filter(function (t) { return delDia(t, d); });
      var pend = suyas.filter(function (t) { return !t.completada_en; });

      var b = el('button');
      b.type = 'button';
      if (mismoDia(d, estado.dia)) b.setAttribute('aria-current', 'true');
      if (mismoDia(d, hoy)) b.classList.add('es-hoy');
      b.setAttribute('aria-label', NOMBRES[d.getDay()] + ' ' + d.getDate());

      b.appendChild(el('span', 'letra', LETRAS[d.getDay()]));
      b.appendChild(el('span', 'num', String(d.getDate())));

      var punto = '';
      if (suyas.length) {
        if (!pend.length) punto = 'hecho';
        else if (inicioDia(d) < hoy) punto = 'tarde';
        else punto = 'pendiente';
      }
      b.appendChild(el('span', 'punto ' + punto));

      (function (fecha) {
        b.addEventListener('click', function () { estado.dia = fecha; render(); });
      })(d);
      tira.appendChild(b);
    }
  }

  function nodoPaso(t) {
    var caja = el('div', 'paso' + (t.completada_en ? ' listo' : ''));
    var fila = el('div', 'paso-fila');

    var m = el('button', 'marca', '✓');
    m.type = 'button';
    m.setAttribute('aria-label', (t.completada_en ? 'Deshacer: ' : 'Completar: ') + t.titulo);
    m.addEventListener('click', async function () {
      m.disabled = true;
      try { await marcar(t, !t.completada_en); await cargar(); }
      catch (e) { m.disabled = false; alert(e.message); }
    });

    fila.appendChild(m);
    fila.appendChild(el('div', 'paso-titulo', t.titulo));
    caja.appendChild(fila);

    if (t.detalle && t.detalle.length > 120) {
      var ver = el('button', 'ver', 'Ver el guion completo ▾');
      ver.type = 'button';
      var g = el('div', 'guion');
      var pre = el('pre'); pre.textContent = t.detalle; g.appendChild(pre);

      var cp = el('button', 'copiar', 'Copiar');
      cp.type = 'button';
      cp.addEventListener('click', function () {
        navigator.clipboard.writeText(t.detalle).then(function () {
          cp.textContent = 'Copiado ✓'; cp.classList.add('ok');
          setTimeout(function () { cp.textContent = 'Copiar'; cp.classList.remove('ok'); }, 1800);
        }, function () { cp.textContent = 'No se pudo copiar'; });
      });
      g.appendChild(cp);

      ver.addEventListener('click', function () {
        var ab = g.classList.toggle('abierto');
        ver.textContent = ab ? 'Ocultar guion ▴' : 'Ver el guion completo ▾';
      });
      caja.appendChild(ver);
      caja.appendChild(g);
    } else if (t.detalle) {
      caja.appendChild(el('div', 'nota', t.detalle));
    }
    return caja;
  }

  function pintarDia() {
    var d = estado.dia;
    var esHoy = mismoDia(d, new Date());
    var br = estado.brief && estado.brief.dias && estado.brief.dias[clave(d)];

    vista.appendChild(el('p', 'fecha',
      (esHoy ? 'Hoy · ' : '') + NOMBRES[d.getDay()] + ' ' + d.getDate() + ' de ' + MESES[d.getMonth()]));

    if (br) {
      vista.appendChild(el('h1', 'titular', br.titular));
      if (br.porque) vista.appendChild(el('p', 'porque', br.porque));
    }

    var suyas = estado.tareas.filter(function (t) { return delDia(t, d); });
    if (suyas.length) {
      suyas.forEach(function (t) { vista.appendChild(nodoPaso(t)); });
    } else if (!br) {
      vista.appendChild(el('p', 'nada', esHoy
        ? 'Nada planificado para hoy.\nPídele a Claude la semana.'
        : 'Nada planificado para este día.'));
    }

    if (br && br.necesito) {
      var n = el('div', 'necesito');
      n.appendChild(el('b', null, 'Necesito de ti'));
      n.appendChild(el('span', null, br.necesito));
      vista.appendChild(n);
    }

    if (br && br.cuerpo) {
      var det = el('details', 'detalle-brief');
      det.appendChild(el('summary', null, 'El detalle del día'));
      var p2 = el('pre'); p2.textContent = br.cuerpo;
      det.appendChild(p2);
      vista.appendChild(det);
    }
  }

  function pintarRutina() {
    var hoy = inicioDia(new Date());
    var rut = estado.tareas.filter(deRutina);
    if (!rut.length) { vista.appendChild(el('p', 'nada', 'No hay tareas fijas.')); return; }

    var pend = rut.filter(function (t) { return !t.completada_en; });
    var hechas = rut.filter(function (t) { return t.completada_en && mismoDia(new Date(t.completada_en), hoy); });

    vista.appendChild(el('p', 'seccion-tit', 'Lo que se repite'));
    pend.sort(function (a, b) { return new Date(a.vence_en || 0) - new Date(b.vence_en || 0); });
    pend.forEach(function (t) {
      var n = nodoPaso(t);
      var tarde = t.vence_en && inicioDia(new Date(t.vence_en)) < hoy;
      n.appendChild(el('div', 'nota', '↻ ' + (REPITE[t.recurrencia] || t.recurrencia) + (tarde ? ' · atrasada' : '')));
      vista.appendChild(n);
    });

    if (hechas.length) {
      vista.appendChild(el('p', 'seccion-tit', 'Hechas hoy · ' + hechas.length));
      hechas.forEach(function (t) { vista.appendChild(nodoPaso(t)); });
    }
  }

  function pintarMas() {
    vista.appendChild(el('p', 'seccion-tit', 'La semana'));

    var ta = el('textarea', 'campo');
    ta.placeholder = 'O pega aquí el bloque a mano';
    var av = el('p', 'aviso');
    var f = el('div', 'fila2');

    var bCargar = el('button', 'btn claro', 'Cargar publicada');
    bCargar.type = 'button';
    bCargar.addEventListener('click', async function () {
      bCargar.disabled = true; av.className = 'aviso'; av.textContent = 'Buscando…';
      try {
        var r = await fetch('semana.json?v=' + Date.now());
        if (!r.ok) throw new Error('No hay semana publicada (' + r.status + ')');
        var j = await r.json();
        ta.value = JSON.stringify(j, null, 1);
        av.className = 'aviso ok'; av.textContent = j.length + ' pieza(s). Dale a Importar.';
      } catch (e) { av.className = 'aviso mal'; av.textContent = e.message; }
      finally { bCargar.disabled = false; }
    });

    var bImp = el('button', 'btn', 'Importar');
    bImp.type = 'button';
    bImp.addEventListener('click', async function () {
      var crudo = ta.value.trim();
      if (!crudo) { av.className = 'aviso mal'; av.textContent = 'Carga o pega primero el bloque.'; return; }
      var datos;
      try { datos = JSON.parse(crudo); }
      catch (e) { av.className = 'aviso mal'; av.textContent = 'Bloque no válido. Cópialo entero.'; return; }
      if (!Array.isArray(datos) || !datos.length) {
        av.className = 'aviso mal'; av.textContent = 'Debe ser una lista de tareas.'; return;
      }
      if (datos.some(function (t) { return !t || !t.titulo || !String(t.titulo).trim(); })) {
        av.className = 'aviso mal'; av.textContent = 'Hay una tarea sin título.'; return;
      }
      bImp.disabled = true; av.className = 'aviso'; av.textContent = 'Importando…';
      try {
        // Dedupe por titulo + día: pegar dos veces no debe duplicar la semana.
        var yaHay = {};
        estado.tareas.forEach(function (t) {
          yaHay[t.titulo + '|' + (t.vence_en ? t.vence_en.slice(0, 10) : '')] = 1;
        });
        var nuevas = datos.filter(function (t) {
          var dia = t.vence_en ? new Date(t.vence_en).toISOString().slice(0, 10) : '';
          return !yaHay[t.titulo + '|' + dia];
        }).map(function (t) {
          return { pin_hash: pinHash, titulo: String(t.titulo).trim(), detalle: t.detalle || null,
                   vence_en: t.vence_en ? new Date(t.vence_en).toISOString() : null,
                   recurrencia: t.recurrencia || null };
        });
        if (!nuevas.length) {
          av.className = 'aviso ok'; av.textContent = 'Ya estaban todas. No se duplicó nada.';
        } else {
          await crear(nuevas);
          av.className = 'aviso ok'; av.textContent = 'Listo: ' + nuevas.length + ' pieza(s).';
          ta.value = '';
          await cargar();
        }
      } catch (e) { av.className = 'aviso mal'; av.textContent = e.message; }
      finally { bImp.disabled = false; }
    });

    f.appendChild(bCargar); f.appendChild(bImp);
    vista.appendChild(f);
    vista.appendChild(ta);
    vista.appendChild(av);

    vista.appendChild(el('p', 'seccion-tit', 'Anotar algo'));
    var ti = el('input', 'campo'); ti.placeholder = 'Nueva tarea';
    var fe = el('input', 'campo'); fe.type = 'datetime-local';
    var bN = el('button', 'btn claro', 'Añadir');
    bN.type = 'button';
    bN.addEventListener('click', async function () {
      if (!ti.value.trim()) return;
      bN.disabled = true;
      try {
        await crear([{ pin_hash: pinHash, titulo: ti.value.trim(),
                       vence_en: fe.value ? new Date(fe.value).toISOString() : new Date().toISOString(),
                       detalle: null, recurrencia: null }]);
        ti.value = ''; fe.value = '';
        estado.tab = 'dia'; estado.dia = inicioDia(new Date());
        await cargar();
      } catch (e) { alert(e.message); }
      finally { bN.disabled = false; }
    });
    vista.appendChild(ti); vista.appendChild(fe); vista.appendChild(bN);
  }

  function render() {
    document.querySelectorAll('.tabs button').forEach(function (b) {
      b.setAttribute('aria-selected', b.dataset.tab === estado.tab ? 'true' : 'false');
    });
    pintarTira();
    vista.innerHTML = '';
    if (estado.tab === 'dia') pintarDia();
    else if (estado.tab === 'rutina') pintarRutina();
    else pintarMas();
  }

  async function cargar() {
    try { estado.tareas = await traer(); }
    catch (e) { vista.innerHTML = ''; vista.appendChild(el('p', 'nada', e.message)); return; }
    render();
  }

  async function cargarBrief() {
    try {
      var r = await fetch('briefing.json?v=' + Date.now());
      if (r.ok) estado.brief = await r.json();
    } catch (e) { /* sin briefing la app sigue siendo usable */ }
  }

  // ── semillas ────────────────────────────────────────────────────────────
  function proximoDia(dw, h) {
    var d = new Date(); d.setHours(h, 0, 0, 0);
    if (d.getDay() === dw && d > new Date()) return d;
    do { d.setDate(d.getDate() + 1); } while (d.getDay() !== dw);
    return d;
  }
  function semillas() {
    var hoy9 = new Date(); hoy9.setHours(9, 0, 0, 0);
    if (hoy9 < new Date()) hoy9.setDate(hoy9.getDate() + 1);
    var mes = new Date(); mes.setMonth(mes.getMonth() + 1, 1); mes.setHours(10, 0, 0, 0);
    return [
      ['Tanda de historias de la semana', 'Pre-armar 18: 6 de valor, 6 CTA, 6 ganchos.', proximoDia(0, 10), 'semanal:0'],
      ['Correr radar.py precios y nuevos', 'Datos frescos para el Radar y Nuevos en el Hub.', proximoDia(0, 9), 'semanal:0'],
      ['Grabar los 2 reels de La Escuela', 'Lunes y miércoles, en una sola sesión.', proximoDia(0, 11), 'semanal:0'],
      ['Grabar reels del viernes y sábado', 'Dependen de los datos de la semana.', proximoDia(4, 10), 'semanal:4'],
      ['Responder comentarios del día', 'En menos de 1 hora vale el doble.', hoy9, 'diaria'],
      ['Revisar las 4 métricas', 'Guardados, compartidos, comentarios y perfiles nuevos.', proximoDia(5, 18), 'semanal:5'],
      ['Podar la sección con menos guardados', 'Cambiarla o eliminarla. Sin cariño.', mes, 'mensual']
    ].map(function (t) {
      return { pin_hash: pinHash, titulo: t[0], detalle: t[1], vence_en: t[2].toISOString(), recurrencia: t[3] };
    });
  }

  // ── arranque ────────────────────────────────────────────────────────────
  var pPin = document.getElementById('p-pin'), pApp = document.getElementById('p-app');

  async function abrir() {
    pPin.hidden = true; pApp.hidden = false;
    await cargarBrief();
    await cargar();
  }

  var entrando = false;
  document.getElementById('entrar').addEventListener('click', async function () {
    if (entrando) return;
    var boton = this;
    var v = document.getElementById('pin').value.trim();
    var err = document.getElementById('pin-error');
    if (v.length < 4) { err.textContent = 'Usa al menos 4 caracteres.'; return; }
    entrando = true; boton.disabled = true; err.textContent = '';
    pinHash = await hash(v);
    localStorage.setItem('romatareas-pin', pinHash);
    try {
      var hubo = await fetch(API + '?select=id&pin_hash=eq.' + pinHash + '&limit=1', { headers: cabeceras() })
        .then(function (r) { return r.json(); });
      if (!hubo.length) await crear(semillas());
    } catch (e) { /* si falla la semilla, la app sigue siendo usable */ }
    entrando = false; boton.disabled = false;
    abrir();
  });
  document.getElementById('pin').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') document.getElementById('entrar').click();
  });
  document.getElementById('salir').addEventListener('click', function () {
    localStorage.removeItem('romatareas-pin'); location.reload();
  });
  document.querySelectorAll('.tabs button').forEach(function (b) {
    b.addEventListener('click', function () {
      estado.tab = b.dataset.tab;
      if (estado.tab === 'dia') estado.dia = inicioDia(new Date());
      render();
    });
  });

  if (pinHash) abrir();
})();
</script>
</body>
</html>
